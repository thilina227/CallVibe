name: Build & Release Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_title:
        description: 'Release Title'
        required: false
        default: 'CallVibe Guard v1.0.0'
      is_prerelease:
        description: 'Mark as Pre-release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Release Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v1.0.0"
          fi
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "Using Tag: $TAG"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Locate Android Project & Prepare Wrapper
        id: locate
        run: |
          PROJECT_DIR=$(find . -name "settings.gradle.kts" -o -name "build.gradle.kts" | head -n 1 | xargs -r dirname)
          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="."
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_OUTPUT
          echo "Found Android project at: $PROJECT_DIR"
          
          cd "$PROJECT_DIR"
          # Ensure gradlew has executable permissions
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi
          
          # Test if the wrapper can execute. If wrapper fails (e.g. missing/corrupt jar), regenerate via gradle CLI
          if ! ./gradlew --version >/dev/null 2>&1; then
            echo "Gradle wrapper failed check, regenerating wrapper with Gradle 8.9..."
            gradle wrapper --gradle-version 8.9 --distribution-type bin
            chmod +x ./gradlew
          fi

      - name: Build Android APK
        run: |
          cd "${{ steps.locate.outputs.PROJECT_DIR }}"
          if ./gradlew --version >/dev/null 2>&1; then
            echo "Building with ./gradlew..."
            ./gradlew assembleRelease --stacktrace --no-daemon
          else
            echo "Falling back to system gradle..."
            gradle assembleRelease --stacktrace --no-daemon
          fi

      - name: Organize Artifacts & Generate Checksums
        run: |
          mkdir -p release-artifacts
          TAG="${{ steps.vars.outputs.TAG }}"
          PDIR="${{ steps.locate.outputs.PROJECT_DIR }}"
          
          APK_PATH=$(find "$PDIR" -type f -name "*.apk" | grep -E "app-(release|debug)\.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find "$PDIR" -type f -name "*.apk" | head -n 1)
          fi
          
          if [ -n "$APK_PATH" ]; then
            echo "Found APK: $APK_PATH"
            cp "$APK_PATH" "release-artifacts/CallVibeGuard-${TAG}.apk"
          else
            echo "::error::No compiled APK found in outputs."
            exit 1
          fi
          
          cd release-artifacts
          sha256sum "CallVibeGuard-${TAG}.apk" > "CallVibeGuard-${TAG}.apk.sha256"
          echo "=== Artifact Checksum ==="
          cat "CallVibeGuard-${TAG}.apk.sha256"

      - name: Ensure Git Tag Exists
        run: |
          TAG="${{ steps.vars.outputs.TAG }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Creating tag $TAG..."
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG" || echo "Tag push skipped (softprops/action-gh-release will manage tag creation)"
          else
            echo "Tag $TAG exists locally"
          fi

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CallVibeGuard-${{ steps.vars.outputs.TAG }}-APK
          path: release-artifacts/*
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.TAG }}
          name: ${{ github.event.inputs.release_title || steps.vars.outputs.TAG }}
          draft: false
          prerelease: ${{ github.event.inputs.is_prerelease || false }}
          generate_release_notes: true
          make_latest: true
          files: |
            release-artifacts/CallVibeGuard-${{ steps.vars.outputs.TAG }}.apk
            release-artifacts/CallVibeGuard-${{ steps.vars.outputs.TAG }}.apk.sha256
          body: |
            ## 📱 CallVibe Guard Android Release (${{ steps.vars.outputs.TAG }})

            ### ✨ Key Features
            - **1/4-Second (250ms) Haptic Pulse**: Immediate tactile cue alerting caller the instant the remote party answers.
            - **Simultaneous Microphone Mute Guard**: Automatically silences mic during the 250ms vibration to prevent mechanical buzz from reaching receiver.
            - **Seamless Unmute**: Restores microphone input immediately when vibration ends so speech is natural and clear.

            ---

            ### 📦 Download & Install
            Download **`CallVibeGuard-${{ steps.vars.outputs.TAG }}.apk`** below to your device.
